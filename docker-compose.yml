services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-nudo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nudo_dev}
      POSTGRES_DB: ${DB_NAME:-nudo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `docker compose up -d --wait` block until Postgres actually accepts
    # connections, instead of returning as soon as the container is created.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-nudo} -d ${DB_NAME:-nudo}']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-writing_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-writing_app_dev}
      POSTGRES_DB: ${DB_NAME:-writing_app}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

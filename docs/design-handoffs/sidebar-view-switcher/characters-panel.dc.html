<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Characters – list in the sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
a{color:#1F1E1C}a:hover{color:#000}
</style>
</helmet>
<div style="width: 300px; height: 760px; box-sizing: border-box; padding: 28px 16px 16px; display: flex; flex-direction: column; background: #FCFBF9; color: #1F1E1C; font-family: Inter, system-ui, sans-serif; border-right: 1px solid #ECE8E2">
  <div style="padding: 0 12px; display: flex; align-items: center; font-weight: 800; font-size: 19px; letter-spacing: -0.05em; line-height: 1">
    <span style="display: block; width: 12px; height: 2px; background: #1F1E1C; margin-right: 1px; margin-top: 3px"></span>nudo<span style="color: #C4552B">.</span>
  </div>
  <button aria-haspopup="menu" style="margin-top: 36px; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 8px">
    <span style="font-family: Newsreader, Georgia, serif; font-size: 23px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap">The Saltmarsh Light</span>
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6B6862" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 3px"><path d="M4 6l4 4 4-4"></path></svg>
  </button>
  <div style="padding: 0 12px; font-size: 13px; color: #6B6862">Manuscript</div>
  <div role="tablist" aria-label="Views" style="margin: 20px 12px 0; display: flex; gap: 20px; border-bottom: 1px solid #E6E1D9">
    <button role="tab" aria-selected="false" style="height: 44px; margin-bottom: -1px; font-size: 14px; font-weight: 500; color: #6B6862; border-bottom: 2px solid transparent">Story</button>
    <button role="tab" aria-selected="true" style="height: 44px; margin-bottom: -1px; font-size: 14px; font-weight: 500; border-bottom: 2px solid #1F1E1C">Characters</button>
    <button role="tab" aria-selected="false" style="height: 44px; margin-bottom: -1px; font-size: 14px; font-weight: 500; color: #6B6862; border-bottom: 2px solid transparent">Plot</button>
  </div>

  <label for="char-search" style="margin: 16px 0 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: #F4F1EC">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6B6862" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
    <input id="char-search" type="search" placeholder="Search characters" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px">
  </label>

  <section style="margin-top: 16px; display: flex; flex-direction: column; gap: 1px">
    <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 12px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #6B6862">CHARACTERS</span>
      <span style="font-size: 11px; color: #6B6862">5</span>
      <button aria-label="Add character" style="margin-left: auto; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #6B6862"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
    </div>
    <button style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px; background: #F0ECE6"><span style="width: 26px; height: 26px; border-radius: 50%; background: #E3EEF8; color: #1F5F8B; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">NA</span>Nell Ashby</button>
    <button style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F9E4EE; color: #8E2F5B; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">T</span>Tomas</button>
    <button style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #ECE8E2; color: #4F4C46; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">E</span>Eamon</button>
    <button style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FBEBD3; color: #7D4E0B; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">G</span>Grandmother</button>
    <button style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font-size: 14px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FBEBD3; color: #7D4E0B; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">M</span>Mother</button>
  </section>

  <button style="margin-top: auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px; border-radius: 8px; font-size: 14px">
    <span style="width: 28px; height: 28px; border-radius: 50%; background: #ECE8E2; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0">DE</span>
    <span style="flex: 1">dev@rgalan.es</span>
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6B6862" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":760}}'>

renderVals() {
return {};
}
}
</script>
</body>
</html>

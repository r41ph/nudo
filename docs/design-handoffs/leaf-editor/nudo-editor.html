<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nudo — Editor (Leaf)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Hanken+Grotesk:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #ECE7DD; }
  #root { height: 100%; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#3E7561"/>
    <text x="50" y="64" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#F7F3EC" text-anchor="middle">n.</text>
  </svg>
</template>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="leaf.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const THEME_KEY = 'nudo-editor-theme';
function getInitialTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') return saved;
  } catch (e) {}
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  return 'light';
}

// Toggle surface colours, per theme, so the control reads clearly in both.
function App() {
  const [theme, setTheme] = useState(getInitialTheme);
  useEffect(() => {
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    document.body.style.background = theme === 'dark' ? '#221D17' : '#ECE7DD';
  }, [theme]);
  return (
    <div style={{ position: 'fixed', inset: 0 }}>
      <DirectionLeaf theme={theme} onToggleTheme={() => setTheme(theme === 'light' ? 'dark' : 'light')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

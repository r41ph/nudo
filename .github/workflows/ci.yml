name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    # config/env.ts (API) reads these at import time — even DB-free unit tests
    # transitively load db.ts. Throwaway CI placeholders, not real secrets.
    env:
      DB_USER: nudo
      DB_PASSWORD: nudo_dev
      DB_NAME: nudo
      DB_HOST: localhost
      DB_PORT: '5432'
      JWT_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Web unit tests
        run: pnpm test:web

      - name: API unit tests
        run: pnpm test:api

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nudo
          POSTGRES_PASSWORD: nudo_dev
          POSTGRES_DB: nudo
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before running steps.
        options: >-
          --health-cmd "pg_isready -U nudo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_USER: nudo
      DB_PASSWORD: nudo_dev
      DB_NAME: nudo
      DB_HOST: localhost
      DB_PORT: '5432'
      JWT_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create & migrate test database
        run: pnpm test:db:setup

      - name: API integration tests
        run: pnpm test:api:int
